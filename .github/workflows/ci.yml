name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test (macOS)
        run: swift test
      - name: Build (iOS Simulator)
        run: xcodebuild build -scheme DualPane-Package -destination 'generic/platform=iOS Simulator' -quiet
      - name: Build demo app (macOS)
        run: xcodebuild build -project Examples/DualPaneDemo/DualPaneDemo.xcodeproj -scheme DualPaneDemo -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -quiet
      - name: Build demo app (iOS Simulator)
        run: xcodebuild build -project Examples/DualPaneDemo/DualPaneDemo.xcodeproj -scheme DualPaneDemo -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet
